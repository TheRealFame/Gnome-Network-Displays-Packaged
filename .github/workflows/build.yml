name: Build gnome-network-displays Packages

on:
  push:
    tags:
      - 'v*'
      - '0.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: "Debian Package (amd64)"
    runs-on: ubuntu-24.04
    container: ubuntu:25.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y git devscripts debhelper-compat meson ninja-build libgstrtspserver-1.0-dev libgstreamer-plugins-base1.0-dev libavahi-client-dev libavahi-gobject-dev libgtk-3-dev libnm-dev libpulse-dev libprotobuf-c-dev libjson-glib-dev libsoup-3.0-dev libportal-gtk4-dev appstream desktop-file-utils gettext build-essential libcairo2-dev libepoxy-dev libgdk-pixbuf-2.0-dev libglib2.0-dev libgraphene-1.0-dev libpango1.0-dev libvulkan-dev libxkbcommon-dev libcolord-dev liblcms2-dev librest-dev libtiff-dev libcloudproviders-dev libsysprof-capture-4-dev sassc libgtk-4-dev libadwaita-1-dev

      - name: Clone upstream source
        run: |
          git clone --depth 1 --branch 0.99.0 https://gitlab.gnome.org/GNOME/gnome-network-displays.git gnome-network-displays-src

      - name: Prepare source
        run: |
          cp -r debian gnome-network-displays-src/

      - name: Build Debian package
        run: |
          cd gnome-network-displays-src
          debuild -us -uc -b

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnome-network-displays-deb
          path: gnome-network-displays_*.deb

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "# GNOME Network Displays $TAG" > release_notes.md
          echo "" >> release_notes.md
          echo "Screencasting for GNOME. Supports the Miracast and Chromecast protocols." >> release_notes.md
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "### AppImage (Universal)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "chmod +x gnome-network-displays-x86_64.AppImage" >> release_notes.md
          echo "./gnome-network-displays-x86_64.AppImage" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Debian/Ubuntu" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo dpkg -i gnome-network-displays_*.deb" >> release_notes.md
          echo "sudo apt-get install -f" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### RPM (Fedora/RHEL/openSUSE)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo rpm -i gnome-network-displays-*.rpm" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Pacman (Arch/Manjaro)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo pacman -U gnome-network-displays-*.pkg.tar.zst" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "## Required Dependencies" >> release_notes.md
          echo "- GStreamer (rtsp-server, bad, good plugins)" >> release_notes.md
          echo "- NetworkManager" >> release_notes.md
          echo "- PulseAudio" >> release_notes.md
          echo "" >> release_notes.md
          echo "_Generated with AI assistance_" >> release_notes.md

      - name: Release Debian package
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: gnome-network-displays_*.deb
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  appimage:
    name: "AppImage (amd64)"
    runs-on: ubuntu-24.04
    container: ubuntu:25.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git wget fuse libfuse2 file meson ninja-build libgstrtspserver-1.0-dev libgstreamer-plugins-base1.0-dev libavahi-client-dev libavahi-gobject-dev libgtk-3-dev libnm-dev libpulse-dev libprotobuf-c-dev libjson-glib-dev libsoup-3.0-dev libportal-gtk4-dev appstream desktop-file-utils gettext libcairo2-dev libepoxy-dev libgdk-pixbuf-2.0-dev libglib2.0-dev libgraphene-1.0-dev libpango1.0-dev libvulkan-dev libxkbcommon-dev libcolord-dev liblcms2-dev librest-dev libtiff-dev libcloudproviders-dev libsysprof-capture-4-dev sassc libgtk-4-dev libadwaita-1-dev

      - name: Clone upstream source
        run: |
          git clone --depth 1 --branch 0.99.0 https://gitlab.gnome.org/GNOME/gnome-network-displays.git gnome-network-displays-src

      - name: Build gnome-network-displays
        run: |
          cd gnome-network-displays-src
          meson setup builddir --prefix=/usr
          ninja -C builddir
          DESTDIR=$(pwd)/../appdir ninja -C builddir install

      - name: Create AppDir structure
        run: |
          mkdir -p appdir/usr/share/applications appdir/usr/share/icons/hicolor/scalable/apps appdir/usr/share/metainfo appdir/usr/share/glib-2.0/schemas
          cp gnome-network-displays-src/builddir/data/org.gnome.NetworkDisplays.desktop appdir/org.gnome.NetworkDisplays.desktop
          cp appdir/usr/share/icons/hicolor/scalable/apps/org.gnome.NetworkDisplays.svg appdir/org.gnome.NetworkDisplays.svg
          cp gnome-network-displays-src/builddir/data/org.gnome.NetworkDisplays.metainfo.xml appdir/usr/share/metainfo/
          sed -i 's|Exec=.*|Exec=gnome-network-displays|' appdir/org.gnome.NetworkDisplays.desktop
          sed -i 's|Icon=.*|Icon=org.gnome.NetworkDisplays|' appdir/org.gnome.NetworkDisplays.desktop

      - name: Create AppRun
        run: |
          cat > appdir/AppRun << 'EOF'
          #!/bin/bash
          set -e
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${HERE}/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH}"
          export XDG_DATA_DIRS="${HERE}/usr/share:${XDG_DATA_DIRS}"
          export APPDIR="${HERE}"
          exec "${HERE}/usr/bin/gnome-network-displays" "$@"
          EOF
          chmod +x appdir/AppRun

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          ./appimagetool --appimage-extract 2>/dev/null; [ -f squashfs-root/AppRun ] && ./squashfs-root/AppRun --no-appstream appdir gnome-network-displays-x86_64.AppImage || ARCH=x86_64 ./appimagetool --appimage-extract-and-run --no-appstream appdir gnome-network-displays-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnome-network-displays-appimage
          path: gnome-network-displays-x86_64.AppImage

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "# GNOME Network Displays $TAG" > release_notes.md
          echo "" >> release_notes.md
          echo "Screencasting for GNOME. Supports the Miracast and Chromecast protocols." >> release_notes.md
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "### AppImage (Universal)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "chmod +x gnome-network-displays-x86_64.AppImage" >> release_notes.md
          echo "./gnome-network-displays-x86_64.AppImage" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Debian/Ubuntu" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo dpkg -i gnome-network-displays_*.deb" >> release_notes.md
          echo "sudo apt-get install -f" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### RPM (Fedora/RHEL/openSUSE)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo rpm -i gnome-network-displays-*.rpm" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Pacman (Arch/Manjaro)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo pacman -U gnome-network-displays-*.pkg.tar.zst" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "## Required Dependencies" >> release_notes.md
          echo "- GStreamer (rtsp-server, bad, good plugins)" >> release_notes.md
          echo "- NetworkManager" >> release_notes.md
          echo "- PulseAudio" >> release_notes.md
          echo "" >> release_notes.md
          echo "_Generated with AI assistance_" >> release_notes.md

      - name: Release AppImage
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: gnome-network-displays-x86_64.AppImage
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rpm:
    name: "RPM Package (amd64)"
    runs-on: ubuntu-24.04
    container: ubuntu:25.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y git rpm meson ninja-build libgstrtspserver-1.0-dev libgstreamer-plugins-base1.0-dev libavahi-client-dev libavahi-gobject-dev libgtk-3-dev libnm-dev libpulse-dev libprotobuf-c-dev libjson-glib-dev libsoup-3.0-dev libportal-gtk4-dev appstream desktop-file-utils gettext libcairo2-dev libepoxy-dev libgdk-pixbuf-2.0-dev libglib2.0-dev libgraphene-1.0-dev libpango1.0-dev libvulkan-dev libxkbcommon-dev libcolord-dev liblcms2-dev librest-dev libtiff-dev libcloudproviders-dev libsysprof-capture-4-dev sassc libgtk-4-dev libadwaita-1-dev

      - name: Clone upstream source
        run: |
          git clone --depth 1 --branch 0.99.0 https://gitlab.gnome.org/GNOME/gnome-network-displays.git gnome-network-displays-src

      - name: Prepare RPM source
        run: |
          mkdir -p /tmp/rpmbuild/BUILD /tmp/rpmbuild/RPMS /tmp/rpmbuild/SOURCES /tmp/rpmbuild/SPECS /tmp/rpmbuild/SRPMS
          cp rpmbuild/SPECS/gnome-network-displays.spec /tmp/rpmbuild/SPECS/
          cd gnome-network-displays-src && git archive --prefix=gnome-network-displays-0.99.0/ --format=tar.gz HEAD > /tmp/rpmbuild/SOURCES/gnome-network-displays-0.99.0.tar.gz

      - name: Build RPM
        run: |
          rpmbuild -bb --nodeps --define "_topdir /tmp/rpmbuild" /tmp/rpmbuild/SPECS/gnome-network-displays.spec

      - name: Copy RPM to workspace
        run: |
          cp /tmp/rpmbuild/RPMS/x86_64/gnome-network-displays-*.rpm .

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnome-network-displays-rpm
          path: gnome-network-displays-*.rpm

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "# GNOME Network Displays $TAG" > release_notes.md
          echo "" >> release_notes.md
          echo "Screencasting for GNOME. Supports the Miracast and Chromecast protocols." >> release_notes.md
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "### AppImage (Universal)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "chmod +x gnome-network-displays-x86_64.AppImage" >> release_notes.md
          echo "./gnome-network-displays-x86_64.AppImage" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Debian/Ubuntu" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo dpkg -i gnome-network-displays_*.deb" >> release_notes.md
          echo "sudo apt-get install -f" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### RPM (Fedora/RHEL/openSUSE)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo rpm -i gnome-network-displays-*.rpm" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Pacman (Arch/Manjaro)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo pacman -U gnome-network-displays-*.pkg.tar.zst" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "## Required Dependencies" >> release_notes.md
          echo "- GStreamer (rtsp-server, bad, good plugins)" >> release_notes.md
          echo "- NetworkManager" >> release_notes.md
          echo "- PulseAudio" >> release_notes.md
          echo "" >> release_notes.md
          echo "_Generated with AI assistance_" >> release_notes.md

      - name: Release RPM
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: gnome-network-displays-*.rpm
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pacman:
    name: "Pacman Package (amd64)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build Pacman package in Arch Linux container
        run: |
          docker run --rm -v "${{ github.workspace }}":/work archlinux/archlinux:latest bash -c "
            pacman -Syu --noconfirm base-devel
            cd /work
            cat > PKGBUILD << 'PKGBUILD_EOF'
            # Maintainer: GNOME Developers
            pkgname=gnome-network-displays
            pkgver=0.99.0
            pkgrel=1
            pkgdesc=\"Screencasting for GNOME. Supports Miracast and Chromecast.\"
            arch=('x86_64')
            url=\"https://gitlab.gnome.org/GNOME/gnome-network-displays\"
            license=('GPL-3.0-or-later')
            depends=('gstreamer' 'gst-plugins-base' 'gst-plugins-bad' 'gst-plugins-good' 'gst-rtsp-server' 'avahi' 'gtk3' 'gtk4' 'libadwaita' 'libportal' 'json-glib' 'libnm' 'libpulse' 'protobuf-c' 'libsoup3')
            makedepends=('meson' 'ninja')
            source=(\"https://gitlab.gnome.org/GNOME/gnome-network-displays/-/archive/\${pkgver}/gnome-network-displays-\${pkgver}.tar.gz\")
            sha256sums=('SKIP')

            build() {
              cd \"\${srcdir}/\${pkgname}-\${pkgver}\"
              meson setup builddir --prefix=/usr
              ninja -C builddir
            }

            package() {
              cd \"\${srcdir}/\${pkgname}-\${pkgver}\"
              DESTDIR=\"\${pkgdir}\" ninja -C builddir install
            }
            PKGBUILD_EOF
            chown -R builduser:builduser .
            su builduser -c 'makepkg -f --noconfirm --skippgpcheck'
          "

      - name: Upload Pacman artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnome-network-displays-pacman
          path: gnome-network-displays-*.pkg.tar.zst

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "# GNOME Network Displays $TAG" > release_notes.md
          echo "" >> release_notes.md
          echo "Screencasting for GNOME. Supports the Miracast and Chromecast protocols." >> release_notes.md
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "### AppImage (Universal)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "chmod +x gnome-network-displays-x86_64.AppImage" >> release_notes.md
          echo "./gnome-network-displays-x86_64.AppImage" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Debian/Ubuntu" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo dpkg -i gnome-network-displays_*.deb" >> release_notes.md
          echo "sudo apt-get install -f" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### RPM (Fedora/RHEL/openSUSE)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo rpm -i gnome-network-displays-*.rpm" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Pacman (Arch/Manjaro)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo pacman -U gnome-network-displays-*.pkg.tar.zst" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "## Required Dependencies" >> release_notes.md
          echo "- GStreamer (rtsp-server, bad, good plugins)" >> release_notes.md
          echo "- NetworkManager" >> release_notes.md
          echo "- PulseAudio" >> release_notes.md
          echo "" >> release_notes.md
          echo "_Generated with AI assistance_" >> release_notes.md

      - name: Release Pacman package
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: gnome-network-displays-*.pkg.tar.zst
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
